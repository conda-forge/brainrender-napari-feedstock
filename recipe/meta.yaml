{% set python_min = "3.12.0" %}
{% set name = "brainrender-napari" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: d4e5b8e112b24c0c7cef145341dba95736016f842fa403cf282fb919ce3c7c62

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools >=45
    - setuptools-scm >=6.2
    - wheel
  run:
    - brainglobe-atlasapi >=3.0.1
    - brainglobe-utils >=0.5.0
    - meshio
    - napari >=0.4.18
    - numpy
    - python >={{ python_min }}
    - qtpy

test:
  imports:
    - brainrender_napari
  commands:
    - pip list
    - pip check || true # ignore test due to HeapDict PyPI metadata issue
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/brainrender-napari
  summary: A napari plugin to render BrainGlobe atlases and associated data as layers.
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/brainglobe/brainrender-napari

extra:
  recipe-maintainers:
    - IgorTatarnikov
    - adamltyson
    - alessandrofelder
    - jaimergp
